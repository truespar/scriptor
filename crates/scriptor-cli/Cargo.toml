[package]
name = "scriptor-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "scriptor"
path = "src/main.rs"

[dependencies]
scriptor-ooxml = { path = "../scriptor-ooxml" }
scriptor-crdt = { path = "../scriptor-crdt" }
scriptor-compare = { path = "../scriptor-compare" }
scriptor-wasm = { path = "../scriptor-wasm" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png"] }
