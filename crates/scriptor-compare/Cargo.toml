[package]
name = "scriptor-compare"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Document comparison (redline / blacklining): compute the A->B edit script between two .docx files
# and replay it as authored tracked-change suggestions onto A's CollabDoc, so the output is an
# ordinary Word redline that flows through the existing accept/reject + display + collab machinery.
# Pure, deterministic diff core (one Myers, parameterized by a predicate) plus an emission driver
# over scriptor-crdt's suggest_* primitives, with the accept=B / reject=A oracle as its check.

[dependencies]
scriptor-crdt = { path = "../scriptor-crdt" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests build minimal `.docx` fixtures directly from OPC parts (style-rename regression).
scriptor-ooxml = { path = "../scriptor-ooxml" }
