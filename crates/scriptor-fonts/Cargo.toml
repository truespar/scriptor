[package]
name = "scriptor-fonts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The font subsystem: Scriptor owns the fidelity-determining policy (matching, metric-compatible
# substitution, OOXML embedded fonts, Word line-height emulation) rather than delegating it to
# cosmic-text/fontdb. Shaping + rasterization still ride cosmic-text/rustybuzz/swash (see
# scriptor-layout). This crate starts with the substitution policy; matching + embedded-font
# loading + metrics land as the engine grows.

