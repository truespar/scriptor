[package]
name = "scriptor-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "scriptor-server"
path = "src/main.rs"

[features]
default = []
# Durable Postgres persistence (system-of-record). Off by default so the dev build/tests need no
# database; the binary then uses in-memory persistence.
postgres = ["dep:sqlx"]

[dependencies]
scriptor-crdt = { path = "../scriptor-crdt" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30"
